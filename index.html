<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.w{padding:60px 5vw}.s{background:var(--sand)}

.k{color:var(--acc);font-weight:600;font-size:14px;margin:0 0 8px}

.card{background:var(--card);border:1px solid var(--line);padding:24px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:18px}
.st div{border:1px solid var(--line);background:var(--card);padding:12px}
.st .on{border-color:var(--acc);background:var(--acc);color:#fff}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;min-height:44px}
footer{background:#1F1B18;color:#EADFCB;padding:44px 5vw;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between}
footer .logo{color:#F0923A}
#adm{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 5vw calc(40px + env(safe-area-inset-bottom,0px));display:none}
#adm label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
[dir="rtl"] body{font-family:'Cairo',system-ui,sans-serif}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .logo{font-family:'Amiri',Georgia,serif;line-height:1.35}
.lg{background:none;border:1px solid var(--acc);color:var(--acc);padding:8px 16px;min-height:44px;cursor:pointer;font:600 14px 'Jost','Cairo',sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 16px;min-height:44px;cursor:pointer;font:600 14px 'Jost','Cairo',sans-serif}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
details{background:var(--card);border:1px solid var(--line);padding:14px 18px;margin-top:10px}summary{cursor:pointer;font-weight:600;min-height:28px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:24px}.fm label{font-weight:600;font-size:14px}.fm .full{grid-column:1/-1}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1F1B18;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}.bar a{flex:1;text-align:center;padding:14px 4px;color:#fff;font-weight:600;min-height:48px}
body{padding-bottom:64px}@media(min-width:700px){.bar{display:none}body{padding-bottom:0}}
#lb{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}#lb img{max-width:100%;max-height:100%}

function resize(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
function A(){const a=$('adm'),y=a.scrollTop;a.style.display='block';a.dir='ltr';
const F=[['hero_t','Titre principal'],['hero_p','Texte d’accueil'],['tel1','Téléphone 1'],['tel2','Téléphone 2'],['wa','N° WhatsApp (chiffres seulement)'],['addr','Adresse'],['mail','E-mail'],['mgr','Gérant'],['hours','Horaires'],['fb','Lien Facebook'],['ig','Lien Instagram'],['hero_t_ar','Titre (arabe)'],['hero_p_ar','Texte d’accueil (arabe)'],['addr_ar','Adresse (arabe)'],['mgr_ar','Gérant (arabe)'],['hours_ar','Horaires (arabe)']];
const P=[['hero','Photo principale'],...CATS.map((c,i)=>['c'+i,c])];
const LE=(k,fs,t)=>`<h3 style="margin-top:28px">${t}</h3>`+D[k].map((o,i)=>`<div class="card" style="margin-top:8px">${fs.map(([f,l])=>`<label>${l}<input data-l="${k}.${i}.${f}" value="${esc(o[f]||'')}"></label>`).join('')}<button class="b o" data-d="${k}.${i}" style="margin-top:10px">Supprimer</button></div>`).join('')+`<button class="b o" data-a="${k}" style="margin-top:10px">Ajouter</button>`;
const QS=['Nouveau','Contacté','Terminé'];
a.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Tableau de bord</h2><button class="b" id="x">Fermer</button></div>
<p>Version de démonstration : les changements sont enregistrés sur cet appareil seulement.</p><p id="msg" role="alert"></p>
<div class="g">${[['Commandes',D.orders.length],['Demandes de devis',D.qt.length],['Photos galerie',D.gal.length],['Témoignages',D.tm.length]].map(([l,n])=>`<div class="card"><b style="font-size:28px">${n}</b><br>${l}</div>`).join('')}</div>
<h3 style="margin-top:28px">Demandes de devis reçues</h3>${D.qt.map((q,i)=>`<div class="card" style="margin-top:8px"><b>${esc(q.n)}</b> · <a href="${tel(q.tel)}">${esc(q.tel)}</a> · ${esc(q.type)} · ${esc(q.d)}<p>${esc(q.msg)}</p><div class="row"><select data-qs="${i}" aria-label="Statut">${QS.map((s,j)=>`<option value="${j}"${j===q.st?' selected':''}>${s}</option>`).join('')}</select><button class="b o" data-d="qt.${i}">Supprimer</button></div></div>`).join('')||'<p>Aucune demande pour le moment.</p>'}
<h3 style="margin-top:28px">Commandes</h3><div id="ol"></div><div class="row"><input id="np" placeholder="Produit commandé" aria-label="Produit commandé" style="max-width:260px"><button class="b o" id="na">Ajouter une commande</button></div>
<h3 style="margin-top:28px">Textes et coordonnées</h3>${F.map(([k,l])=>`<label>${l}<input data-k="${k}" value="${esc(D[k]||'')}"></label>`).join('')}
<h3 style="margin-top:28px">Photos principales</h3>${P.map(([k,l])=>`<label>${l}<input type="file" accept="image/*" data-p="${k}"></label>`).join('')}
<h3 style="margin-top:28px">Galerie des réalisations</h3><label>Ajouter une photo<input type="file" accept="image/*" id="ga"></label>${D.gal.map((g,i)=>`<div class="card row" style="margin-top:8px"><img src="${g.img}" alt="" width="64" height="64" style="object-fit:cover"><input data-l="gal.${i}.t" value="${esc(g.t||'')}" placeholder="Titre" aria-label="Titre" style="flex:1 1 140px"><select data-gc="${i}" aria-label="Catégorie">${CATS.map((c,j)=>`<option value="${j}"${g.c===j?' selected':''}>${c}</option>`).join('')}</select><button class="b o" data-d="gal.${i}">Supprimer</button></div>`).join('')}
${LE('tm',[['n','Nom du client'],['txt','Témoignage'],['n_ar','Nom (arabe)'],['txt_ar','Témoignage (arabe)']],'Témoignages')}
${LE('faq',[['q','Question'],['a','Réponse'],['q_ar','Question (arabe)'],['a_ar','Réponse (arabe)']],'Questions fréquentes')}
${LE('pg',[['t','Titre de la page'],['b','Contenu'],['t_ar','Titre (arabe)'],['b_ar','Contenu (arabe)']],'Pages ajoutées (apparaissent dans le menu)')}
<div class="row" style="margin-top:28px"><button class="b o" id="rs">Tout réinitialiser</button></div>`;
const S=(q,fn)=>a.querySelectorAll(q).forEach(fn);
const O=()=>{$('ol').innerHTML=D.orders.map((o,i)=>`<div class="card row" style="margin-top:8px"><b>${esc(o.id)}</b><span>${esc(o.prod)}</span><select data-o="${i}" aria-label="Statut">${STEPS.map((s,j)=>`<option value="${j}"${j===o.st?' selected':''}>${s}</option>`).join('')}</select><button class="b o" data-d="orders.${i}">Supprimer</button></div>`).join('');
$('ol').querySelectorAll('select').forEach(s=>s.onchange=()=>{D.orders[s.dataset.o].st=+s.value;save()});$('ol').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{D.orders.splice(+b.dataset.d.split('.')[1],1);save();A()})};O();
S('[data-k]',e=>e.oninput=()=>{D[e.dataset.k]=e.value;save();R()});
S('[data-l]',e=>e.oninput=()=>{const[k,i,f]=e.dataset.l.split('.');D[k][i][f]=e.value;save();R()});
S('[data-d]',e=>{if(!e.dataset.d.startsWith('orders'))e.onclick=()=>{const[k,i]=e.dataset.d.split('.');D[k].splice(+i,1);save();R();A()}});
S('[data-a]',e=>e.onclick=()=>{D[e.dataset.a].push({});save();A()});
S('[data-gc]',e=>e.onchange=()=>{D.gal[e.dataset.gc].c=+e.value;save();R()});
S('[data-qs]',e=>e.onchange=()=>{D.qt[e.dataset.qs].st=+e.value;save()});
S('[data-p]',e=>e.onchange=()=>{if(e.files[0])resize(e.files[0],u=>{D.ph[e.dataset.p]=u;save();R()})});
$('ga').onchange=e=>{if(e.target.files[0])resize(e.target.files[0],u=>{D.gal.push({img:u,c:0,t:''});save();R();A()})};
$('na').onclick=()=>{const p=$('np').value.trim();if(p){D.orders.push({id:'OU-'+(1001+D.orders.length),client:'',prod:p,st:0});save();$('np').value='';O()}};
$('rs').onclick=()=>{if($('rs').dataset.c){localStorage.removeItem('mo');location.reload()}else{$('rs').dataset.c=1;$('rs').textContent='Confirmer : tout effacer'}};
$('x').onclick=()=>{a.style.display='none'};
a.scrollTop=y}
R();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
